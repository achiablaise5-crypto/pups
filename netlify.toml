[build]
  publish = "pups"
  command = "echo 'Static site - no build step'"

# The Express + socket.io API (server.js) cannot run on Netlify.
# It is hosted separately; its origin is set in pups/public/site-config.js
# and read by the chat widget and admin panel.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
